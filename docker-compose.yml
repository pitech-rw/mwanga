services:
  server:
    build:
      context: ./server
    develop:
      watch: 
        - action: sync  
          path: ./server
          target: /app
          initial_sync: true
          ignore: 
           - node_modules
           - dist
        - action: rebuild
          path: ./server/package.json  
          
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${postgres_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: