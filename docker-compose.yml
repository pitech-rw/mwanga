services:
  server:
    build:
      context: ./server
    develop:
      watch: 
        - action: sync  
          path: ./server
          target: /app
          initial_sync: true
          ignore: 
           - node_modules
           - dist
        - action: rebuild
          path: ./server/package.json  
          
    ports:
      - "3005:3005"
