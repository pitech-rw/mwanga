services:
  server:
    image: pitechrw/mwanga-server:latest
    build: !reset null   # Compose v2.24+; or omit build entirely in prod-only file
    ports:
      - "127.0.0.1:3005:3005"
    env_file:
      - .env
    restart: unless-stopped

  web:
    image: pitechrw/mwanga-web:latest
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    restart: unless-stopped