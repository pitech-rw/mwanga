services:
  server:
    build:
      context: ./server
      target: development
    develop:
      watch: 
        - action: sync  
          path: ./server
          target: /app
          initial_sync: true
          ignore:
           - node_modules
           - dist
           - tsconfig.build.tsbuildinfo
        - action: rebuild
          path: ./server/package.json  
          
    ports:
      - "3005:3005"
    env_file:
      - ./server/.env
    environment:
      PORT: 3005
      # In Compose, localhost is this container — use the db service name.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build:
      context: ./web
      target: development
    develop:
      watch:
        - action: sync
          path: ./web
          target: /app
          initial_sync: true
          ignore:
            - node_modules
            - .next
        - action: rebuild
          path: ./web/package.json
    ports:
      - "5000:3000"
    env_file:
      - ./web/.env
    depends_on:
      - server
    volumes:
      - web_next_cache:/app/.next

volumes:
  web_next_cache:
  postgres_data: